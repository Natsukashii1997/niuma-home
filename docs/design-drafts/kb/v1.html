<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · V1 文件夹墙</title>
<link rel="stylesheet" href="common.css">
<style>
/* V1 文件夹墙：保留黑页签文件夹，但每个文件夹直接摊开成清单（最多 6 行，多的就地展开）；
   「待归类」是同一套页签 + 夹子 + 清单的宽文件夹，放在最上面；文件夹按最短列依次排（行优先），不留大空洞。 */
.v1-board { display: flex; flex-direction: column; gap: 40px; padding: var(--s5); border: var(--border) solid var(--line); background-color: var(--panel-soft); background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1.3px); background-size: 16px 16px; }
.v1-folder { position: relative; padding-top: 30px; min-width: 0; }
.v1-tab { position: absolute; left: 0; top: 0; z-index: 2; display: flex; align-items: center; max-width: 92%; height: 32px; background: var(--text); color: var(--panel); }
.v1-tab-name { display: flex; align-items: center; gap: var(--s2); min-width: 0; height: 100%; padding: 0 10px 0 12px; border: 0; background: none; color: inherit; cursor: grab; }
.v1-tab-name strong { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.v1-tab-name i { font-style: normal; font-family: var(--font-pixel); font-size: 14px; color: var(--signal); }
.v1-tab-edit { display: grid; place-items: center; width: 28px; height: 100%; border: 0; border-left: 1px solid var(--text-2); background: none; color: var(--panel); cursor: pointer; visibility: hidden; }
.v1-folder:hover .v1-tab-edit { visibility: visible; }
.v1-case { border: var(--border) solid var(--text); background: var(--panel); }
.v1-list { margin: 0; padding: var(--s2) 0 var(--s1); list-style: none; }
.v1-sub { margin: 0 0 var(--s1) 23px; padding: 0; list-style: none; border-left: 2px solid var(--text); }
.v1-row { display: flex; align-items: flex-start; gap: var(--s2); min-height: 32px; padding: 6px var(--s3); }
.v1-row:hover .ext { visibility: visible; }
.v1-row .ty { margin-top: 1px; }
.v1-title { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 13px; line-height: 20px; }
.v1-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.v1-row .date, .v1-row .busy { line-height: 20px; }
.v1-row .sc { margin-top: 2px; }
.v1-row.is-dir { cursor: pointer; }
.v1-row.is-dir .v1-title { font-weight: 600; }
.v1-row.is-dir .v1-n { flex: none; font-family: var(--font-mono); font-size: 11px; line-height: 20px; color: var(--muted); }
.v1-row.is-dir .v1-chev { flex: none; display: grid; place-items: center; width: 22px; height: 20px; }
.v1-row.is-dim { opacity: 0.35; }
.v1-more { display: flex; align-items: center; gap: 6px; width: 100%; height: 32px; padding: 0 var(--s3); border: 0; border-top: 1px dashed var(--line); background: none; font-size: 12px; color: var(--text-2); cursor: pointer; }
.v1-more:hover { color: var(--text); background-image: var(--dither-1); }
.v1-empty { margin: 0; padding: var(--s5) var(--s3); font-size: 12px; color: var(--muted); text-align: center; }
.v1-lip { display: flex; align-items: center; gap: var(--s3); height: 36px; padding: 0 var(--s3); border-top: var(--border) solid var(--text); background-color: var(--panel-soft); background-image: var(--dither-1); font-family: var(--font-mono); font-size: 11px; color: var(--text-2); }
.v1-lip a { display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
.v1-lip a:hover { color: var(--signal); }
.v1-folder.is-empty .v1-case { border-style: dashed; }
.v1-folder.is-dim { opacity: 0.4; }

/* 待归类：同一套语法，页签反白、夹子虚线，清单三列铺开 */
.v1-inbox .v1-tab { background: var(--panel); color: var(--text); box-shadow: inset 0 0 0 2px var(--text); }
.v1-inbox .v1-case { border-style: dashed; }
.v1-inbox-head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2) var(--s3); padding: var(--s3) var(--s3) 0; font-size: 12px; color: var(--muted); }
.v1-inbox-head .hint { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--text-2); }
.v1-inbox .v1-list { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: var(--s4); }
.v1-inbox .v1-row { border-bottom: 1px solid var(--panel-soft); }
.v1-inbox.is-clear .v1-case { padding: var(--s3); }

.v1-wall { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 0 var(--s6); align-items: start; }
/* 拖到文件夹上：只框夹子，页签变橙 */
.v1-folder.drop.is-over { outline: none !important; background-image: none !important; }
.v1-folder.is-over > .v1-case { border-style: dashed; border-color: var(--signal); background-image: var(--dither-1); }
.v1-folder.is-over > .v1-tab { background: var(--signal); color: var(--panel); box-shadow: none; }
.v1-folder.is-over > .v1-tab i { color: var(--panel); }
.v1-col { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
</style>
</head>
<body>
<main id="page">
  <p id="kb-note" class="kb-note" hidden></p>
  <section class="v1-board" id="board"></section>
</main>
<script src="icons7.js"></script>
<script src="kb-data.js"></script>
<script src="common.js"></script>
<script>
const { icon, esc, model, count, latest, mmdd, ty, sc, date, ext, hit, hits, docs, state } = NB;
const MAX = 6;
const openMore = new Set(), openDir = new Set();
const board = document.getElementById("board");
const colsFor = () => { const w = board.clientWidth - 48; return w >= 1000 ? 3 : w >= 620 ? 2 : 1; };

function row(n, depth = 0) {
  const q = state.q.trim();
  if (n.kids) {
    const open = openDir.has(n.id) || (q && hits(n) > 0);
    return `<li class="v1-row is-dir drop${q && !hits(n) ? " is-dim" : ""}" data-doc="${n.id}" data-drop="${n.id}" draggable="true" data-dither onclick="toggleDir(event,'${n.id}')">
        ${ty(n)}<span class="v1-title">${esc(n.name)}</span><span class="v1-n">${count(n)} 篇</span>${date(n)}<span class="v1-chev">${icon(open ? "down" : "right")}</span></li>
      ${open ? `<ul class="v1-sub">${n.kids.length ? n.kids.map((k) => row(k, depth + 1)).join("") : `<li class="v1-row"><span class="muted small">空文件夹</span></li>`}</ul>` : ""}`;
  }
  const d = docs[n.id] || {};
  return `<li class="v1-row${q && !hit(n) ? " is-dim" : ""}" data-doc="${n.id}" draggable="true" data-dither>
      ${ty(n)}${sc(n)}<a class="v1-title" href="${esc(d.url || "#")}" target="_blank" rel="noreferrer" draggable="false" title="${esc(d.excerpt || n.name)}">${esc(n.name)}</a>${date(n)}${ext(n)}</li>`;
}

function folder(g) {
  const kids = [...g.kids.filter((k) => k.kids), ...g.kids.filter((k) => !k.kids)];
  const more = openMore.has(g.id) || state.q.trim() ? kids : kids.slice(0, MAX);
  const rest = kids.length - more.length, dirs = g.kids.filter((k) => k.kids).length;
  const dim = state.q.trim() && !hits(g);
  const url = docs[g.id]?.url;
  return `<article class="v1-folder drop${g.kids.length ? "" : " is-empty"}${dim ? " is-dim" : ""}" data-drop="${g.id}">
    <header class="v1-tab"><button class="v1-tab-name" title="点击收起 / 拖动排序"><strong>${esc(g.name)}</strong><i>${count(g)}</i></button><button class="v1-tab-edit" title="改名（写入飞书）">${icon("edit")}</button></header>
    <div class="v1-case">
      ${kids.length ? `<ul class="v1-list">${more.map((k) => row(k)).join("")}</ul>` : `<p class="v1-empty">空文件夹 · 把文档拖进来</p>`}
      ${rest > 0 ? `<button class="v1-more" onclick="toggleMore('${g.id}')">${icon("down")}展开其余 ${rest} 篇</button>` : kids.length > MAX && !state.q.trim() ? `<button class="v1-more" onclick="toggleMore('${g.id}')">${icon("up")}收起到 ${MAX} 篇</button>` : ""}
      <footer class="v1-lip"><span>${count(g)} 篇${dirs ? ` · ${dirs} 个子文件夹` : ""}${state.q.trim() && hits(g) ? ` · 命中 ${hits(g)}` : ""}</span><span>更新 ${mmdd(latest(g))}</span><span class="spacer"></span>${url ? `<a href="${esc(url)}" target="_blank" rel="noreferrer">本页正文 ${icon("external")}</a>` : ""}</footer>
    </div>
  </article>`;
}

function render() {
  const m = model(), cols = colsFor();
  board.style.setProperty("--cols", cols);
  const inbox = `<article class="v1-folder v1-inbox drop${m.loose.length ? "" : " is-clear"}" data-drop="" style="--cols:${cols}">
    <header class="v1-tab"><span class="v1-tab-name"><strong>待归类</strong><i>${m.loose.length}</i></span></header>
    <div class="v1-case">
      ${m.loose.length ? `<div class="v1-inbox-head"><span>收藏时归类不明确的放这里；文件夹里的文档也能拖回来</span><span class="hint">${icon("down")}拖进下面任一文件夹 = 在飞书里移动</span></div>
      <ul class="v1-list">${m.loose.map((n) => row(n)).join("")}</ul>` : `<span class="small muted">没有待归类的文档，都在文件夹里</span>`}
    </div></article>`;
  // 行优先、放进当前最矮的一列；高度按行数估算，避免某一列特别长
  const colsH = Array.from({ length: cols }, () => ({ h: 0, html: [] }));
  m.groups.forEach((g) => {
    const rows = Math.min(g.kids.length, openMore.has(g.id) ? 99 : MAX) + (g.kids.length > MAX ? 1 : 0) + 2;
    const c = colsH.reduce((a, b) => (b.h < a.h ? b : a));
    c.h += rows + 2; c.html.push(folder(g));
  });
  board.innerHTML = inbox + `<div class="v1-wall">${colsH.map((c) => `<div class="v1-col">${c.html.join("")}</div>`).join("")}</div>`;
}
function toggleMore(id) { openMore.has(id) ? openMore.delete(id) : openMore.add(id); NB.render(); }
function toggleDir(e, id) { if (e.target.closest(".ext")) return; openDir.has(id) ? openDir.delete(id) : openDir.add(id); NB.render(); }
let lastCols = 0;
new ResizeObserver(() => { if (colsFor() !== lastCols) { lastCols = colsFor(); NB.render(); } }).observe(board);
NB.start("V1 文件夹墙", render);
</script>
</body>
</html>
