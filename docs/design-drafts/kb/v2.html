<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · V2 目录 + 阅读台</title>
<link rel="stylesheet" href="common.css">
<style>
/* V2 目录 + 阅读台：左边一份完整目录（每组下面直接列出全部篇名，可折叠），右边是选中文件夹的阅读台（大卡片带摘要）。
   「待归类」是目录第一项，默认选中；把右边的卡片拖到左边任一分组名上就是归类。两栏同高，左栏吸顶滚动。 */
.v2 { display: grid; grid-template-columns: 340px minmax(0, 1fr); align-items: stretch; border: var(--border) solid var(--line); background: var(--panel); }
.v2-index { position: sticky; top: 34px; align-self: start; max-height: calc(100vh - 34px); overflow: auto; border-right: var(--border) solid var(--line); background: var(--panel); }
.v2-index-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: var(--s2); height: 48px; padding: 0 var(--s4); border-bottom: 1px solid var(--line); background: var(--panel); }
.v2-index-head strong { font-size: 14px; }
.v2-index-head .tnum { font-size: 11px; color: var(--muted); }
.v2-grp { border-bottom: 1px solid var(--line); }
.v2-grp-head { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; height: 36px; padding: 0 var(--s3) 0 var(--s2); border: 0; background: none; text-align: left; cursor: pointer; }
.v2-grp-head .tog { display: grid; place-items: center; width: 20px; height: 20px; color: var(--muted); }
.v2-grp-head strong { flex: 1; min-width: 0; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.v2-grp-head i { font-style: normal; font-family: var(--font-pixel); font-size: 14px; color: var(--muted); }
.v2-grp-head:hover { background-image: var(--dither-1); }
.v2-grp.is-sel > .v2-grp-head { background: var(--text); color: var(--panel); }
.v2-grp.is-sel > .v2-grp-head::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--signal); }
.v2-grp.is-sel > .v2-grp-head .tog { color: var(--panel); }
.v2-grp.is-sel > .v2-grp-head i { color: var(--signal); }
.v2-grp.is-inbox > .v2-grp-head i { color: var(--signal); }
.v2-grp.is-inbox { border-bottom: var(--border) solid var(--text); }
.v2-lines { margin: 0; padding: 2px 0 var(--s2); list-style: none; }
.v2-line { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 var(--s3) 0 34px; font-size: 12px; color: var(--text-2); cursor: pointer; }
.v2-line > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v2-line::before { content: ""; flex: none; width: 6px; height: 6px; border: 1px solid var(--text-2); }
.v2-line.is-dir::before { background: var(--text); border-color: var(--text); }
.v2-line.is-dir { color: var(--text); font-weight: 600; }
.v2-line.is-sheet::before { background-image: var(--dither-ink-2); }
.v2-line.is-dim { opacity: 0.35; }
.v2-line.is-cur { color: var(--text); background: var(--orange-soft); }
.v2-line:hover { color: var(--text); background-image: var(--dither-1); }
.v2-line .sc { height: 14px; font-size: 9px; }
.v2-line.lv2 { padding-left: 50px; }
.v2-add { display: flex; align-items: center; gap: 6px; width: 100%; height: 40px; padding: 0 var(--s4); border: 0; background: none; color: var(--muted); cursor: pointer; }

.v2-desk { min-width: 0; padding: 0 var(--s5) var(--s5); background-color: var(--panel-soft); background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1.3px); background-size: 16px 16px; }
.v2-desk-head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2) var(--s3); min-height: 72px; padding: var(--s4) 0; border-bottom: var(--border) solid var(--text); margin-bottom: var(--s5); }
.v2-crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 18px; }
.v2-crumb button { padding: 0; border: 0; background: none; font-size: 18px; color: var(--muted); cursor: pointer; }
.v2-crumb button:hover { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
.v2-crumb .pixel-icon { color: var(--muted); }
.v2-desk-meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.v2-desk-hint { display: flex; align-items: center; gap: 6px; margin: calc(-1 * var(--s3)) 0 var(--s4); font-size: 12px; color: var(--text-2); }
.v2-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s4); }
.v2-card { display: flex; flex-direction: column; gap: var(--s2); min-height: 168px; padding: var(--s3) var(--s4); border: var(--border) solid var(--line); background: var(--panel); }
.v2-card:hover { border-color: var(--text); }
.v2-card:hover .ext { visibility: visible; }
.v2-card-top { display: flex; align-items: center; gap: 6px; }
.v2-card h4 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45; }
.v2-card p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; font-size: 12px; line-height: 1.55; color: var(--muted); }
.v2-card p.is-none { font-family: var(--font-mono); font-size: 11px; }
.v2-card footer { display: flex; align-items: center; gap: var(--s2); margin-top: auto; padding-top: var(--s2); border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
.v2-card footer a { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
.v2-card footer a:hover { color: var(--signal); }
.v2-card.is-dir { border-left: 6px solid var(--text); cursor: pointer; }
.v2-card.is-dir .v2-peeks { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--text-2); }
.v2-card.is-dir .v2-peeks li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v2-card.is-dir .v2-peeks li::before { content: "· "; color: var(--muted); }
.v2-card.is-cur { border-color: var(--signal); }
.v2-empty { padding: var(--s6); border: 2px dashed var(--line); background: var(--panel); text-align: center; color: var(--muted); }
.v2-grp-head.drop.is-over { background-color: var(--panel) !important; color: var(--text) !important; }

@media (max-width: 1200px) { .v2 { grid-template-columns: 240px minmax(0, 1fr); } .v2-desk { padding: 0 var(--s4) var(--s4); } .v2-cards { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--s3); } .v2-line { padding-left: 30px; } }
</style>
</head>
<body>
<main id="page">
  <p id="kb-note" class="kb-note" hidden></p>
  <section class="v2" id="board"></section>
</main>
<script src="icons7.js"></script>
<script src="kb-data.js"></script>
<script src="common.js"></script>
<script>
const { icon, esc, model, count, latest, mmdd, ty, sc, date, ext, hit, hits, docs, state, locate, TYPE_ZH } = NB;
let sel = "", path = [], cur = "";
const folded = new Set();
const board = document.getElementById("board");
const q = () => state.q.trim();

function lines(kids, lv = 1) {
  return kids.map((k) => {
    const dim = q() && !(k.kids ? hits(k) : hit(k));
    const cls = `v2-line lv${lv}${k.kids ? " is-dir" : ""}${docs[k.id]?.type === "sheet" || docs[k.id]?.type === "bitable" ? " is-sheet" : ""}${dim ? " is-dim" : ""}${cur === k.id ? " is-cur" : ""}`;
    const own = `<li class="${cls}${k.kids ? " drop" : ""}" data-doc="${k.id}" ${k.kids ? `data-drop="${k.id}"` : ""} draggable="true" onclick="pick('${k.id}')"><span>${esc(k.name)}</span>${sc(k)}${k.kids ? `<span class="date">${count(k)} 篇</span>` : date(k)}</li>`;
    return own + (k.kids && lv < 2 ? lines(k.kids, lv + 1) : "");
  }).join("");
}

function group(g, inbox) {
  const id = inbox ? "" : g.id, kids = inbox ? g : g.kids, n = inbox ? g.length : count(g);
  const open = !folded.has(id) || (q() && kids.some((k) => (k.kids ? hits(k) : hit(k))));
  return `<div class="v2-grp${sel === id ? " is-sel" : ""}${inbox ? " is-inbox" : ""}">
    <button class="v2-grp-head drop" data-drop="${id}" onclick="select('${id}')"><span class="tog" onclick="fold(event,'${id}')">${icon(open ? "down" : "right")}</span><strong>${inbox ? "待归类" : esc(g.name)}</strong><i>${n}</i></button>
    ${open && kids.length ? `<ul class="v2-lines">${lines(kids)}</ul>` : ""}</div>`;
}

function card(k) {
  const d = docs[k.id] || {};
  if (k.kids) return `<article class="v2-card is-dir drop${cur === k.id ? " is-cur" : ""}" data-doc="${k.id}" data-drop="${k.id}" draggable="true" data-dither onclick="enter('${k.id}')">
      <div class="v2-card-top">${ty(k)}<span class="spacer"></span>${date(k)}</div><h4>${esc(k.name)}</h4>
      <ul class="v2-peeks">${k.kids.slice(0, 3).map((x) => `<li>${esc(x.name)}</li>`).join("")}</ul>
      <footer><span>文件夹 · ${count(k)} 篇</span><a>进入 ${icon("right")}</a></footer></article>`;
  return `<article class="v2-card${cur === k.id ? " is-cur" : ""}" data-doc="${k.id}" draggable="true" data-dither>
      <div class="v2-card-top">${ty(k)}${sc(k)}<span class="spacer"></span>${date(k)}</div>
      <h4 title="${esc(k.name)}">${esc(k.name)}</h4>
      ${d.excerpt ? `<p>${esc(d.excerpt.replace(k.name, "").trim() || d.excerpt)}</p>` : `<p class="is-none">${TYPE_ZH[d.type] || "文档"}暂不读取摘要</p>`}
      <footer><span>${TYPE_ZH[d.type] || "文档"}${d.shortcut ? " · 快捷方式" : ""}</span>${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noreferrer" draggable="false" onclick="event.stopPropagation()">打开飞书原文 ${icon("external")}</a>` : ""}</footer></article>`;
}

function desk(m) {
  if (!sel) {
    return `<div class="v2-desk-head drop" data-drop=""><div class="v2-crumb"><strong>待归类</strong></div><span class="v2-desk-meta">${m.loose.length} 篇 · 收藏时归类不明确的放这里</span></div>
      ${m.loose.length ? `<p class="v2-desk-hint">${icon("left")}把卡片拖到左边任一分组名上 = 在飞书里移动到那个目录</p><div class="v2-cards">${m.loose.map(card).join("")}</div>` : `<div class="v2-empty">没有待归类的文档</div>`}`;
  }
  const g = m.groups.find((x) => x.id === sel);
  let dir = g; const trail = [g];
  for (const id of path) { const nx = dir.kids.find((k) => k.id === id); if (!nx) break; dir = nx; trail.push(nx); }
  const kids = [...dir.kids.filter((k) => k.kids), ...dir.kids.filter((k) => !k.kids)].filter((k) => !q() || (k.kids ? hits(k) : hit(k)));
  const url = docs[dir.id]?.url;
  return `<div class="v2-desk-head drop" data-drop="${dir.id}">
      <div class="v2-crumb">${trail.map((f, i) => (i < trail.length - 1 ? `<button onclick="path=path.slice(0,${i});NB.render()">${esc(f.name)}</button>${icon("right")}` : `<strong>${esc(f.name)}</strong>`)).join("")}</div>
      <span class="v2-desk-meta">${count(dir)} 篇 · 更新 ${mmdd(latest(dir))}</span><span class="spacer"></span>
      ${url ? `<a class="btn is-sm" href="${esc(url)}" target="_blank" rel="noreferrer">${icon("external")}本页正文</a>` : ""}
      <button class="btn is-sm">${icon("edit")}改名</button>${path.length ? `<button class="btn is-sm" onclick="path=path.slice(0,-1);NB.render()">${icon("up")}上一级</button>` : ""}</div>
    ${kids.length ? `<div class="v2-cards">${kids.map(card).join("")}</div>` : `<div class="v2-empty drop" data-drop="${dir.id}">${q() ? "没有命中" : "空文件夹 · 把卡片拖进来"}</div>`}`;
}

function render() {
  const m = model();
  board.innerHTML = `<aside class="v2-index"><div class="v2-index-head"><strong>目录</strong><span class="tnum">${m.groups.length} 组 · ${m.groups.reduce((s, g) => s + count(g), 0) + m.loose.length} 篇</span><span class="spacer"></span><button class="icon-btn" title="全部折叠 / 展开" onclick="foldAll()">${icon("menu")}</button></div>
      ${group(m.loose, true)}${m.groups.map((g) => group(g)).join("")}<button class="v2-add">${icon("plus")}新建分组</button></aside>
    <div class="v2-desk">${desk(m)}</div>`;
}
function select(id) { sel = id; path = []; cur = ""; NB.render(); }
function fold(e, id) { e.stopPropagation(); folded.has(id) ? folded.delete(id) : folded.add(id); NB.render(); }
function foldAll() { const m = model(); if (folded.size) folded.clear(); else ["", ...m.groups.map((g) => g.id)].forEach((id) => folded.add(id)); NB.render(); }
function enter(id) { path = [...path, id]; cur = ""; NB.render(); }
// 点左边篇名：选中它所在的分组（必要时进到子文件夹），右边对应卡片描橙边
function pick(id) {
  const m = model(), trail = [];
  let h = locate(id); cur = id;
  for (let p = h.parent; p; p = locate(p.id).parent) trail.unshift(p);
  if (!trail.length) { sel = ""; path = []; }
  else { sel = trail[0].id; path = trail.slice(1).map((x) => x.id); if (h.node.kids) path.push(id); }
  NB.render();
  document.querySelector(`.v2-card[data-doc="${id}"]`)?.scrollIntoView({ block: "nearest" });
}
if (NB.params.has("sel")) { const g = model().groups.find((x) => x.name.startsWith(NB.params.get("sel"))); if (g) sel = g.id; }
NB.start("V2 目录 + 阅读台", render);
</script>
</body>
</html>
