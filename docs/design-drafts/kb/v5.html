<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · V5 1-bit 桌面</title>
<link rel="stylesheet" href="common.css">
<style>
/* V5 1-bit 桌面：整块画布是一台老式黑白电脑的桌面。每个文件夹是一扇打开的窗口（条纹标题栏、左上卷起方块），
   窗口里一行一篇，全部列出；桌面上散着的图标就是待归类，拖进任一窗口即归类。
   动效全部按帧：点黑色文件夹 → 4 帧缩放框从那一行飞到窗口再进入；点左上方块 → 窗口逐帧卷起 / 放下；落定 → 标题栏反色闪两下。 */
.v5-desk { position: relative; isolation: isolate; border: var(--border) solid var(--text); background-color: var(--panel-soft); background-image: var(--dither-2); }
.v5-menubar { display: flex; align-items: center; gap: var(--s4); height: 30px; padding: 0 var(--s3); border-bottom: var(--border) solid var(--text); background: var(--panel); font-size: 12px; }
.v5-menubar strong { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.v5-menubar .tnum { font-size: 11px; color: var(--text-2); }
.v5-inner { padding: var(--s5); }

/* 桌面图标 = 待归类 */
.v5-icons { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--s3) var(--s2); min-height: 120px; margin-bottom: var(--s2); padding: var(--s2); }
.v5-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 112px; padding: 4px 0; color: var(--text); text-align: center; }
.v5-icon-img { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border: 2px solid var(--text); background: var(--panel); }
.v5-icon-img .px { position: absolute; right: -10px; bottom: -6px; padding: 0 2px; border: 1px solid var(--text); background: var(--panel); font-size: 9px; line-height: 12px; }
.v5-icon-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 112px; padding: 1px 4px; background: var(--panel); font-size: 12px; line-height: 16px; overflow-wrap: anywhere; }
.v5-icon:hover .v5-icon-label { background: var(--text); color: var(--panel); }
.v5-icon:hover .v5-icon-img { background: var(--text); color: var(--panel); }
.v5-icon .date { padding: 0 3px; background: var(--panel); }
.v5-icon .busy { padding: 0 3px; background: var(--panel); }
.v5-desk-tip { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 var(--s5) var(--s2); padding: 2px 8px; border: 1px solid var(--text); background: var(--panel); font-size: 12px; color: var(--text-2); }
.v5-desk-tip b { color: var(--text); }
.v5-desk-tip i { font-style: normal; font-family: var(--font-pixel); color: var(--signal); }

/* 窗口 */
.v5-wins { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 0 var(--s6); align-items: start; }
.v5-col { display: flex; flex-direction: column; gap: var(--s6); min-width: 0; }
.v5-win { position: relative; min-width: 0; border: var(--border) solid var(--text); background: var(--panel); }
.v5-win::after { content: ""; position: absolute; z-index: -1; left: 6px; top: 6px; right: -8px; bottom: -8px; background-image: var(--dither-ink-2); }
.v5-title { position: relative; display: flex; align-items: center; justify-content: center; height: 26px; padding: 0 30px; border-bottom: var(--border) solid var(--text); background: repeating-linear-gradient(var(--text) 0 1px, var(--panel) 1px 3px); background-clip: content-box; padding-top: 5px; padding-bottom: 5px; }
.v5-title strong { max-width: 100%; overflow: hidden; padding: 0 8px; background: var(--panel); font-size: 13px; line-height: 16px; text-overflow: ellipsis; white-space: nowrap; }
.v5-title strong i { font-style: normal; font-family: var(--font-pixel); font-weight: 400; color: var(--signal); }
.v5-box { position: absolute; top: 5px; display: grid; place-items: center; width: 16px; height: 16px; padding: 0; border: 2px solid var(--text); background: var(--panel); color: var(--text); cursor: pointer; }
.v5-box.l { left: 8px; }
.v5-box.r { right: 8px; }
.v5-box:hover { background: var(--text); color: var(--panel); }
.v5-win.is-blink .v5-title { background: var(--text); }
.v5-win.is-blink .v5-title strong { background: var(--text); color: var(--panel); }
.v5-info { display: flex; align-items: center; gap: var(--s2); height: 26px; padding: 0 var(--s3); border-bottom: 1px solid var(--text); font-family: var(--font-mono); font-size: 11px; color: var(--text-2); }
.v5-info button { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: var(--text); cursor: pointer; }
.v5-info a { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; color: var(--text); }
.v5-info a:hover, .v5-info button:hover { color: var(--signal); }
.v5-list { margin: 0; padding: 4px 0; list-style: none; }
.v5-row { display: flex; align-items: flex-start; gap: var(--s2); padding: 5px var(--s3); color: var(--text); }
.v5-row > .pixel-icon { margin-top: 3px; }
.v5-row .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; overflow-wrap: anywhere; }
.v5-row .date, .v5-row .busy { line-height: 20px; }
.v5-row:hover { background: var(--text); color: var(--panel); }
.v5-row:hover .date { color: var(--line); }
.v5-row:hover .date.is-new { color: var(--signal); }
.v5-row.is-dir .nm { font-weight: 600; }
.v5-row.is-dir .n { flex: none; font-family: var(--font-mono); font-size: 11px; line-height: 20px; color: inherit; }
.v5-row.is-dim { opacity: 0.3; }
.v5-empty { margin: 0; padding: var(--s5) var(--s3); font-size: 12px; color: var(--muted); text-align: center; }
.v5-win.is-shade .v5-info { border-bottom: 0; }
.v5-win.drop.is-over { outline-offset: 2px !important; background-image: none !important; }
.v5-win.is-over .v5-list { background-image: var(--dither-1); }
/* 缩放框：进入子文件夹时 4 帧，每帧一个描边矩形 */
.v5-zoom { position: fixed; z-index: 30; border: 2px dashed var(--text); pointer-events: none; }
</style>
</head>
<body>
<main id="page">
  <p id="kb-note" class="kb-note" hidden></p>
  <section class="v5-desk" id="board"></section>
</main>
<script src="icons7.js"></script>
<script src="kb-data.js"></script>
<script src="common.js"></script>
<script>
const { icon, esc, model, count, latest, mmdd, isNew, hit, hits, docs, state, TYPE, TYPE_ZH, TY_ICON, frames, locate } = NB;
const paths = {}, shaded = new Set();
const board = document.getElementById("board");
const q = () => state.q.trim();
const colsOf = () => { const w = board.clientWidth - 52; return w >= 1040 ? 3 : w >= 620 ? 2 : 1; };

function current(g) {
  let dir = g; const trail = [g];
  for (const id of paths[g.id] || []) { const nx = dir.kids.find((k) => k.id === id); if (!nx) break; dir = nx; trail.push(nx); }
  return { dir, trail };
}
function row(g, k) {
  const d = docs[k.id] || {};
  if (k.kids) return `<li class="v5-row is-dir drop${q() && !hits(k) ? " is-dim" : ""}" data-doc="${k.id}" data-drop="${k.id}" draggable="true" onclick="enter(this,'${g.id}','${k.id}')">${icon("folder")}<span class="nm">${esc(k.name)}</span><span class="n">${count(k)} 项</span>${icon("right")}</li>`;
  return `<li><a class="v5-row${q() && !hit(k) ? " is-dim" : ""}" data-doc="${k.id}" draggable="true" href="${esc(d.url || "#")}" target="_blank" rel="noreferrer" title="${esc(TYPE_ZH[d.type] || "文档")} · 点击打开飞书原文">${icon(TY_ICON[d.type] || "file")}<span class="nm">${esc(k.name)}</span><span class="date${isNew(d.updated) ? " is-new" : ""}">${mmdd(d.updated)}</span></a></li>`;
}
function win(g) {
  const { dir, trail } = current(g), shade = shaded.has(g.id);
  const kids = [...dir.kids.filter((k) => k.kids), ...dir.kids.filter((k) => !k.kids)];
  const url = docs[dir.id]?.url;
  return `<article class="v5-win drop${shade ? " is-shade" : ""}" data-drop="${dir.id}" id="w-${g.id}">
    <div class="v5-title"><button class="v5-box l" title="${shade ? "放下窗口" : "卷起窗口"}" onclick="shade('${g.id}')"></button><strong>${esc(g.name)} <i>${count(g)}</i></strong><button class="v5-box r" title="改名（写入飞书）">${icon("edit")}</button></div>
    <div class="v5-info">${trail.length > 1 ? `<button onclick="back('${g.id}')">${icon("left")}上一级</button><span>/ ${esc(dir.name)} · ${count(dir)} 项</span>` : `<span>${kids.length} 项 · 更新 ${mmdd(latest(g))}${q() && hits(g) ? ` · 命中 ${hits(g)}` : ""}</span>`}${url ? `<a href="${esc(url)}" target="_blank" rel="noreferrer">本页正文 ${icon("external")}</a>` : ""}</div>
    ${shade ? "" : kids.length ? `<ul class="v5-list">${kids.map((k) => row(g, k)).join("")}</ul>` : `<p class="v5-empty">空窗口 · 把图标拖进来</p>`}
  </article>`;
}
function deskIcon(n) {
  const d = docs[n.id] || {};
  return `<a class="v5-icon${q() && !hit(n) ? " is-dim" : ""}" data-doc="${n.id}" draggable="true" href="${esc(d.url || "#")}" target="_blank" rel="noreferrer" title="${esc(n.name)}"><span class="v5-icon-img">${icon(TY_ICON[d.type] || "file", 28)}<span class="px">${TYPE[d.type] || "DOC"}</span></span><span class="v5-icon-label">${esc(n.name)}</span><span class="date${isNew(d.updated) ? " is-new" : ""}">${mmdd(d.updated)}</span></a>`;
}
function render() {
  const m = model(), cols = colsOf();
  const colsH = Array.from({ length: cols }, () => ({ h: 0, html: [] }));
  m.groups.forEach((g) => { const c = colsH.reduce((a, b) => (b.h < a.h ? b : a)); c.h += (shaded.has(g.id) ? 0 : Math.max(2, current(g).dir.kids.length)) + 4; c.html.push(win(g)); });
  board.innerHTML = `<div class="v5-menubar"><strong>${icon("kb")}${esc(NB.KB.space)}</strong><span class="tnum">${m.groups.length} 个窗口 · ${m.groups.reduce((s, g) => s + count(g), 0) + m.loose.length} 篇</span><span class="spacer"></span><span class="tnum">上次同步 ${esc(NB.KB.readAt)}</span></div>
    <div class="v5-inner">
      <div class="v5-icons drop" data-drop="">${m.loose.length ? m.loose.map(deskIcon).join("") : ""}</div>
      <p class="v5-desk-tip">${m.loose.length ? `桌面上的 <i>${m.loose.length}</i> 篇是<b>待归类</b>，把图标拖进任一窗口 = 在飞书里移动；点左上方块卷起窗口，点文件夹进入` : "桌面上没有待归类的文档"}</p>
      <div class="v5-wins" style="--cols:${cols}">${colsH.map((c) => `<div class="v5-col">${c.html.join("")}</div>`).join("")}</div>
    </div>`;
}

// 进入子文件夹：4 帧缩放框，从那一行到整扇窗口
function enter(el, gid, id) {
  const a = el.getBoundingClientRect(), b = document.getElementById(`w-${gid}`).getBoundingClientRect();
  const boxes = [];
  frames(4, (f) => {
    const t = f / 4, z = document.createElement("div"); z.className = "v5-zoom";
    Object.assign(z.style, { left: `${a.left + (b.left - a.left) * t}px`, top: `${a.top + (b.top - a.top) * t}px`, width: `${a.width + (b.width - a.width) * t}px`, height: `${a.height + (b.height - a.height) * t}px` });
    document.body.appendChild(z); boxes.push(z); if (boxes.length > 2) boxes.shift().remove();
  }, () => { boxes.forEach((z) => z.remove()); paths[gid] = [...(paths[gid] || []), id]; NB.render(); });
}
function back(gid) { paths[gid] = (paths[gid] || []).slice(0, -1); NB.render(); }
// 卷起：一帧收掉三分之一的行；放下：直接重画后逐帧露出
function shade(gid) {
  const w = document.getElementById(`w-${gid}`), rows = [...w.querySelectorAll(".v5-list > *")];
  if (shaded.has(gid)) {
    shaded.delete(gid); NB.render();
    const r2 = [...document.querySelectorAll(`#w-${gid} .v5-list > *`)]; r2.forEach((r) => (r.hidden = true));
    const step = Math.ceil(r2.length / 3); frames(3, (f) => r2.slice(0, f * step).forEach((r) => (r.hidden = false)));
    return;
  }
  const step = Math.ceil(rows.length / 3) || 1;
  frames(3, (f) => rows.slice(Math.max(0, rows.length - f * step)).forEach((r) => (r.hidden = true)), () => { shaded.add(gid); NB.render(); });
}
// 落定：目标窗口标题栏反色闪两下
NB.onLanded = (pid) => {
  let n = locate(pid)?.node; const g = model().groups.find((x) => x.id === pid || (n && locate(pid) && JSON.stringify(x).includes(pid)));
  const w = g && document.getElementById(`w-${g.id}`); if (w) frames(4, (f) => w.classList.toggle("is-blink", f % 2 === 1));
};
let lastCols = 0;
new ResizeObserver(() => { const c = colsOf(); if (c !== lastCols) { lastCols = c; NB.render(); } }).observe(board);
if (NB.params.has("in")) model().groups.forEach((g) => g.kids.forEach((k) => k.kids && k.name.includes(NB.params.get("in")) && (paths[g.id] = [k.id])));
if (NB.params.has("shade")) model().groups.filter((g) => g.name.startsWith(NB.params.get("shade"))).forEach((g) => shaded.add(g.id));
NB.start("V5 1-bit 桌面", render);
</script>
</body>
</html>
