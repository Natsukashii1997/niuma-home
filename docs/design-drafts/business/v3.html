<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务页 V3 聚焦式</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* V3：一次只看一条业务线。切换后：大图 + 右侧读数 + 下方面积块（名字和占比直接写在块里）。 */
  .focus { display: grid; grid-template-columns: minmax(0, 9fr) minmax(0, 3fr); gap: var(--s4); align-items: stretch; }
  .readout { display: flex; flex-direction: column; background: var(--panel); border: var(--border) solid var(--line); }
  .readout .rk { padding: var(--s3) var(--s4); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .readout .rk:first-child { border-top: 0; }
  .readout .rk.hero { padding: var(--s4); background: var(--panel); }
  .readout .rk.hero .num { font-size: 40px; line-height: 1; }
  .readout .rk.hero .num small { margin-left: var(--s1); font: 400 13px var(--font-sans); color: var(--muted); }
  .readout .v { font-family: var(--font-mono); font-size: 16px; font-weight: 600; }
  .readout .v small { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }
  .readout .s { font-size: 12px; color: var(--muted); }
  .readout .rk.last { flex: 1; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); margin-top: var(--s4); }
  .tm { position: relative; }
  .tm > div { position: absolute; overflow: hidden; padding: 4px 6px; color: #fff; display: flex; flex-direction: column; justify-content: flex-start; }
  .tm b { font-size: 12px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm span { font-family: var(--font-mono); font-size: 11px; line-height: 1.3; white-space: nowrap; }
  .tm .big b { font-size: 14px; } .tm .big span.p { font-size: 18px; font-weight: 600; }
  .tm .other { background-image: var(--dither-ink-1); border: 1px solid currentColor; }
  .tm .other .chip { align-self: flex-start; white-space: normal; line-height: 1.4; padding: 2px 6px; background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .tm-rest { margin-top: var(--s2); font-size: 12px; color: var(--text-2); line-height: 1.7; }
  .tm-rest .mono { font-family: var(--font-mono); color: var(--muted); }
  .top10 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--s5); list-style: none; margin: 0; padding: 0; counter-reset: r; }
  .top10 li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: var(--s2); align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .top10 .r { font-family: var(--font-pixel); font-size: 16px; color: var(--muted); }
  .top10 li:nth-child(-n+3) .r { color: var(--text); }
  .top10 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top10 .p { font-family: var(--font-mono); font-weight: 600; }
  .top10 .a { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 52px; text-align: right; }
  .mix { display: flex; gap: 2px; height: 56px; }
  .mix > div { display: flex; flex-direction: column; justify-content: center; padding: 0 var(--s2); color: #fff; min-width: 0; }
  .mix b { font-size: 13px; white-space: nowrap; } .mix span { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
  .mix-rows { margin-top: var(--s3); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
  .mix-rows > div { border-top: 3px solid; padding-top: var(--s2); font-size: 12px; color: var(--text-2); }
  .mix-rows b { display: block; font-size: 13px; color: var(--text); }
  @media (max-width: 1180px) {
    .focus { grid-template-columns: 1fr; }
    .readout { flex-direction: row; flex-wrap: wrap; }
    .readout .rk { flex: 1 1 0; min-width: 0; border-top: 0; border-left: 1px solid var(--line); }
    .readout .rk:first-child { border-left: 0; }
    .readout .rk.hero .num { font-size: 28px; }
    .top10 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="page">
  <div class="page-header">
    <div><h1>业务</h1><p class="page-subtitle">营收完成度、月度趋势与当月营收分布 · 来源：飞书「当月策略盘」</p></div>
    <div style="display:flex;gap:12px;align-items:center"><span class="small muted" id="upd"></span><button class="btn">重新读取</button><a class="link">在飞书查看 ↗</a></div>
  </div>
  <div id="rev"></div>

  <div class="section-head"><div class="seg" id="seg"></div><span class="spacer"></span><span class="small muted">实线今年 · 虚线去年 · 灰网点列为当月（未过完）</span></div>
  <div id="view"></div>
  <p class="note"><b>稿件说明</b>　一次只看一条线：上面切换，整块（趋势、读数、构成）跟着换，不再一屏 14 张图。占比改成面积块，名字、占比、金额都写在块里；放不下的写在块下。学校太分散（大学 326 所），只列前 10。切换不做动画，直接换。</p>
</div>
<script src="assets/data.js"></script>
<script src="assets/kit.js"></script>
<script>
const { LINES, trend, share, topN, nf, pct, money, signed, esc, mount, lineChart, revenueCard, frame, BIZ, year, month, day, daysInMonth, textW } = K;
frame("V3 聚焦式");
document.getElementById("upd").textContent = `更新 ${BIZ.updatedAt}`;
document.getElementById("rev").innerHTML = revenueCard();
const T = { total: trend("total"), uni: trend("uni"), intl: trend("intl"), appeal: trend("appeal"), conv: trend("conv") };
const VIEWS = ["total", "uni", "intl", "appeal"];
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "total";

// 方块树图（squarified）：返回 [{item,x,y,w,h}]
function squarify(items, W, H) {
  const total = items.reduce((a, i) => a + i.value, 0), out = [];
  let rest = items.map(i => ({ item: i, a: i.value / total * W * H })), x = 0, y = 0, w = W, h = H;
  const worst = (row, side) => { const s = row.reduce((a, r) => a + r.a, 0), mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a)); return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)); };
  while (rest.length) {
    const side = Math.min(w, h); let row = [rest[0]], i = 1;
    while (i < rest.length && worst([...row, rest[i]], side) <= worst(row, side)) { row.push(rest[i]); i++; }
    rest = rest.slice(i);
    const s = row.reduce((a, r) => a + r.a, 0);
    if (w >= h) { const cw = s / h; let cy = y; row.forEach(r => { const ch = r.a / cw; out.push({ item: r.item, x, y: cy, w: cw, h: ch }); cy += ch; }); x += cw; w -= cw; }
    else { const ch = s / w; let cx = x; row.forEach(r => { const cw2 = r.a / ch; out.push({ item: r.item, x: cx, y, w: cw2, h: ch }); cx += cw2; }); y += ch; h -= ch; }
  }
  return out;
}
function treemap(el, s, color) {
  const draw = () => {
    const W = el.clientWidth, H = 260; if (!W) return;
    // 「其他」放最后、单独一块
    const parts = topN(s, 9), main = parts.filter(p => !p.other), other = parts.find(p => p.other);
    const otherW = other ? Math.max(104, other.share * W) : 0;
    const tiles = squarify(main, W - otherW, H);
    if (other) tiles.push({ item: other, x: W - otherW, y: 0, w: otherW, h: H });
    const rest = [];
    el.querySelector(".tm").style.height = `${H}px`;
    el.querySelector(".tm").innerHTML = tiles.map(({ item: p, x, y, w, h }) => {
      const g = 2, big = w > 160 && h > 90, nameOk = w - 12 >= Math.min(textW(p.label, 12), 72), full = nameOk && h >= 56, mid = !full && nameOk && h >= 36, pOnly = !full && !mid && w >= 36 && h >= 22;
      if (!full && !mid && !p.other) rest.push(p);
      const style = `left:${x + (x ? g : 0)}px;top:${y + (y ? g : 0)}px;width:${w - (x ? g : 0)}px;height:${h - (y ? g : 0)}px;${p.other ? `color:${color}` : `background:${color}`}`;
      const inner = p.other ? `<span class="chip">${esc(p.label)} · ${pct(p.share, 1)}</span>` : full ? `<b>${esc(p.label)}</b><span class="p">${pct(p.share, 1)}</span><span>${nf(p.value / 1e4, 1)} 万</span>` : mid ? `<b>${esc(p.label)}</b><span>${pct(p.share, 1)}</span>` : pOnly ? `<span>${pct(p.share, 0)}</span>` : "";
      return `<div class="${p.other ? "other" : ""}${big ? " big" : ""}" style="${style}" title="${esc(p.label)} · ${nf(p.value, 2)} 元 · ${pct(p.share, 2)}">${inner}</div>`;
    }).join("");
    el.querySelector(".tm-rest").innerHTML = rest.length ? `块里没写名字的：${rest.map(p => `${esc(p.label)} <span class="mono">${pct(p.share, 1)}</span>`).join(" · ")}` : "";
  };
  let w0 = 0; new ResizeObserver(() => { if (el.clientWidth !== w0) { w0 = el.clientWidth; draw(); } }).observe(el);
}
const card = (title, extra, body) => `<section class="card"><div class="card-head"><h3>${title}</h3>${extra ? `<span class="small muted">${extra}</span>` : ""}</div><div class="card-body">${body}</div></section>`;

function render() {
  document.getElementById("seg").innerHTML = VIEWS.map(k => `<button class="${k === view ? "on" : ""}" data-k="${k}">${LINES[k].name}</button>`).join("");
  const t = T[view], L = LINES[view], color = L.color;
  const best = t.now.reduce((a, v, i) => (v != null && i !== t.partial && v > t.now[a] ? i : a), 0);
  const readout = `<div class="readout">
    <div class="rk hero"><span class="label">${month} 月至今 · 第 ${day}/${daysInMonth} 天</span><span class="num">${nf(t.cur / 1e4)}<small>万</small></span></div>
    <div class="rk"><span class="label">按日均推算月底</span><span class="v" style="color:var(--signal)">≈ ${nf(t.pace / 1e4)}<small>万（示意）</small></span><span class="s">去年 ${month} 月 ${nf(t.lastSame / 1e4)} 万 · <span class="${t.pace >= t.lastSame ? "up" : "down"}">${signed(t.pace / t.lastSame - 1)}</span></span></div>
    <div class="rk"><span class="label">1–${month - 1} 月累计</span><span class="v">${money(t.ytd)}</span><span class="s">同比 <span class="${t.ytdYoY >= 0 ? "up" : "down"}">${t.ytdYoY >= 1 ? `×${nf(t.ytdYoY + 1, 1)}` : signed(t.ytdYoY)}</span> · 去年同期 ${money(t.ytdLast)}</span></div>
    <div class="rk last"><span class="label">今年最高</span><span class="v">${best + 1} 月 · ${nf(t.now[best] / 1e4)}<small>万</small></span>${view === "total" ? "" : `<span class="s">占当月总营收 ${pct(t.cur / T.total.cur, 0)}</span>`}</div>
  </div>`;
  let html = `<div class="focus">${card(`${view === "total" ? "" : `<i style="width:10px;height:10px;background:${color}"></i>`}${L.name} · 月度`, "每点标今年金额（万元）；下排为同比", `<div class="chart-host" id="big"></div>`)}${readout}</div>`;
  if (view === "total") {
    const mix = ["uni", "intl", "appeal"].map(k => ({ k, v: T[k].cur }));
    html += `<div class="pair">${card("总转化率", `今年均值 ${pct(T.conv.ytd / (month - 1))} · 去年 ${pct(T.conv.ytdLast / (month - 1))}`, `<div class="chart-host" id="conv"></div>`)}
      ${card(`${month} 月至今 · 三条业务线`, "条长 = 占总营收比例", `<div class="mix">${mix.map(m => `<div style="flex:${m.v} 0 0;background:${LINES[m.k].hex}"><b>${LINES[m.k].short}</b><span>${pct(m.v / T.total.cur, 0)}</span></div>`).join("")}</div>
        <div class="mix-rows">${mix.map(m => `<div style="border-color:${LINES[m.k].hex}"><b>${LINES[m.k].name}</b>至今 ${nf(m.v / 1e4)} 万<br>推算 ${nf(T[m.k].pace / 1e4)} 万 · 去年同月 ${nf(T[m.k].lastSame / 1e4)} 万<br><span class="${T[m.k].pace >= T[m.k].lastSame ? "up" : "down"}">推算较去年同月 ${signed(T[m.k].pace / T[m.k].lastSame - 1)}</span></div>`).join("")}</div>
        <p class="small muted" style="margin-top:12px">选上方业务线，看该线的地区、SKU、学校构成。</p>`)}</div>`;
  } else {
    const sku = share(view, "SKU"), reg = share(view, "地区"), third = share(view, view === "intl" ? "科目一级" : "学校");
    html += `<div class="section-head"><h2>${month} 月构成</h2><span class="tag">${BIZ.period}</span><span class="small muted">实收 ${nf(sku.total, 2)} 元 · 按原图的实收金额与本月收款日期筛选，与上方营收进度的汇总来源不同</span></div>`;
    html += `<div class="pair" style="margin-top:0">${card("SKU", `${sku.count} 项 · 面积 = 占比`, `<div id="tm-sku"><div class="tm"></div><div class="tm-rest"></div></div>`)}${card("地区", `${reg.count} 项 · 面积 = 占比`, `<div id="tm-reg"><div class="tm"></div><div class="tm-rest"></div></div>`)}</div>`;
    const thirdBody = third.onlyBlank ? `<div class="empty">源表「${third.dim}」还没有反写，当月 ${money(third.total)} 全部计为「未填写」</div>`
      : `<ol class="top10">${third.items.slice(0, 10).map((i, n) => `<li title="${esc(i.label)} · ${nf(i.value, 2)} 元"><span class="r">${String(n + 1).padStart(2, "0")}</span><span class="nm">${esc(i.label)}</span><span class="p">${pct(i.share)}</span><span class="a">${nf(i.value / 1e4, 1)} 万</span></li>`).join("")}</ol>
         <p class="small muted" style="margin-top:8px">其余 ${third.count - 10} 所合计 ${pct(third.items.slice(10).reduce((a, i) => a + i.share, 0), 0)}。</p>`;
    html += `<div style="margin-top:16px">${card(third.dim === "学校" ? `学校 · 前 10` : third.dim, third.dim === "学校" ? `${third.count} 所，非常分散，不画面积` : "", thirdBody)}</div>`;
  }
  document.getElementById("view").innerHTML = html;
  mount(document.getElementById("big"), w => lineChart(w, t, { h: 320, color, labels: true, projection: true, yoy: true }));
  if (view === "total") mount(document.getElementById("conv"), w => lineChart(w, T.conv, { h: 200, labels: false, yoy: true }));
  else { treemap(document.getElementById("tm-sku"), share(view, "SKU"), LINES[view].hex); treemap(document.getElementById("tm-reg"), share(view, "地区"), LINES[view].hex); }
}
document.getElementById("seg").addEventListener("click", e => { const k = e.target.dataset?.k; if (k && k !== view) { view = k; history.replaceState(null, "", `#${k}`); render(); } });
render();
</script>
</body>
</html>
